<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de autos</title>
</head>
<body>

    <h1>Listado de autos</h1>

    <nav>
        <a href="/items.html">Ítems</a>
        <a href="/procedimiento.html">Procedimiento</a>
        <a href="/cerrar-sesion">Cerrar sesión</a>
    </nav>

    <main>
        <div id="lista-autos"></div>
    </main>

    <script>
        //Obtenemos los autos desde la API
        async function cargarAutos() {
            try {
                const respuesta = await fetch('/api/v1/autos');
                const autos = await respuesta.json();

                const lista = document.getElementById('lista-autos');

                autos.forEach((auto) => {
                    const elemento = document.createElement('div');

                    elemento.innerHTML = `
                        <h2>${auto.marca} ${auto.modelo}</h2>
                        <p>Año: ${auto.año}</p>
                        <p>Precio: $${auto.precio}</p>
                        <p>Stock: ${auto.stock}</p>
                        <a href="/item.html?id=${auto.id}">Ver detalle</a>
                    `;

                    lista.appendChild(elemento);
                });

            } catch (error) {
                console.error('Error al cargar los autos:', error);
            }
        }

        cargarAutos();
    </script>

</body>
</html>
